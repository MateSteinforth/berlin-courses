<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berlin Courses</title>
<meta name="description" content="All Berlin university courses in one place, filterable by time of day and distance from you.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e4572e'/><path d='M8 10h16M8 16h16M8 22h10' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>try { const t = localStorage.getItem("bc.theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch {}</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>Berlin Courses</h1>
      <p class="sub" id="metaLine">Loading…</p>
    </div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Search titles, lecturers, topics…" autocomplete="off">
  </div>
  <div class="top-actions">
    <button id="theme" class="btn ghost icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
    <button id="openList" class="btn primary">★ My list <span id="favCountTop" class="count light"></span></button>
    <button id="toggleFilters" class="btn ghost mobile-only">Filters</button>
  </div>
</header>

<div class="layout">
  <aside class="filters" id="filters">
    <section>
      <h3>Semester</h3>
      <div id="semesters" class="chips"></div>
    </section>
    <section>
      <h3>University</h3>
      <div id="unis" class="chips"></div>
    </section>
    <section>
      <h3>Distance</h3>
      <form class="addr" id="addrForm">
        <input id="addr" placeholder="Your address, e.g. Oranienstr. 25" autocomplete="street-address">
        <button class="btn" type="submit">Set</button>
      </form>
      <p class="hint" id="addrFound">Not stored anywhere. Looked up via OpenStreetMap.</p>
      <div class="dist-controls off" id="distControls">
        <div class="slider-head"><span>Max distance</span><b id="kmVal">any</b></div>
        <input type="range" id="km" min="1" max="25" step="0.5" value="25">
        <div class="slider-head"><span>Max travel time</span><b id="minVal">any</b></div>
        <input type="range" id="maxMin" min="5" max="90" step="5" value="90">
        <div class="mode-row" id="modes"></div>
        <p class="hint" id="travelStatus"></p>
      </div>
    </section>
    <section>
      <h3>Time of day</h3>
      <div class="slider-head"><span id="todLabel">any time</span></div>
      <div class="range2" id="todRange">
        <div class="track"><div class="fill" id="todFill"></div></div>
        <input type="range" id="todA" min="420" max="1320" step="30" value="420" aria-label="From">
        <input type="range" id="todB" min="420" max="1320" step="30" value="1320" aria-label="To">
      </div>
      <div class="ticks"><span>7</span><span>10</span><span>13</span><span>16</span><span>19</span><span>22</span></div>
    </section>
    <section>
      <h3>Days</h3>
      <div id="days" class="chips"></div>
    </section>
    <section>
      <h3>Format</h3>
      <div id="formats" class="chips"></div>
      <label class="toggle"><input type="checkbox" id="fPast" checked> Hide blocks/dates already over</label>
      <label class="toggle"><input type="checkbox" id="fArr"> Include “by arrangement” / no dates</label>
    </section>
    <section>
      <h3>Language</h3>
      <div id="langs" class="chips"></div>
    </section>
    <section id="relSection">
      <h3>D+C relevance</h3>
      <div id="rel" class="chips"></div>
    </section>
    <section id="tagSection">
      <h3>Topics</h3>
      <div id="tags" class="chips small"></div>
    </section>
    <button class="btn ghost full" id="reset">Reset filters</button>
  </aside>

  <main>
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button role="tab" data-view="list" class="active">List</button>
        <button role="tab" data-view="map">Map</button>
        <button role="tab" data-view="mine">★ My list <span id="favCount" class="count"></span></button>
      </div>
      <div class="sort">
        <span id="resultCount"></span>
        <select id="sort">
          <option value="rel">Sort: relevance</option>
          <option value="travel">Sort: travel time</option>
          <option value="time">Sort: day &amp; time</option>
          <option value="title">Sort: title</option>
        </select>
      </div>
    </div>
    <div id="view-list" class="view active"><div id="list"></div><button id="more" class="btn ghost full" hidden>Show more</button></div>
    <div id="view-map" class="view"><div id="map"></div></div>
    <div id="view-mine" class="view"><div id="mine"></div></div>
  </main>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-bg" data-close></div>
  <article class="drawer-panel" id="drawerBody"></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
