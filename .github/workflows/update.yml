name: Update data & deploy

on:
  # Daily check is cheap: each source has its own next-update date in
  # data/state.json, and only sources that are due get crawled.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Crawl all sources now, ignoring their schedule"
        type: boolean
        default: false
      source:
        description: "Only this source (e.g. tu_moses, udk_hisinone, fu_vv, hu_agnes, htw_lsf, udk_sg)"
        type: string
        default: ""
      ai_unis:
        description: "Run the AI step only for these universities (comma-separated, or 'all')"
        type: string
        default: "UdK"
  push:
    branches: [main]
    paths: ["site/**", "crawler/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest data, not the (possibly older) commit that triggered a queued run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Crawl catalogs that are due
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional logins, only needed if a source stops being public:
          UDK_USER: ${{ secrets.UDK_USER }}
          UDK_PASS: ${{ secrets.UDK_PASS }}
          TU_USER: ${{ secrets.TU_USER }}
          TU_PASS: ${{ secrets.TU_PASS }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" != "true" ]; then ARGS="--due"; fi
          if [ -n "${{ inputs.source }}" ]; then ARGS="$ARGS --source ${{ inputs.source }}"; fi
          python -m crawler crawl $ARGS || echo "::warning::some catalog sources failed"
          if [ -z "${{ inputs.source }}" ]; then
            python -m crawler lms $( [ "${{ inputs.force }}" != "true" ] && echo --due ) || echo "::warning::LMS crawl failed"
          fi

      # Save crawled data right away, even if a crawl failed – later steps can't lose it.
      - name: Commit crawled data
        if: always() && github.event_name != 'push'
        run: bash scripts/commit-data.sh "Crawl $(date -u +%F)"

      # AI only on scheduled/manual runs (a code push never spends tokens). Submit the
      # Batch API job first and commit its id, so a cancelled run can be resumed.
      - name: Submit AI batch (new/changed courses only)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_UNIS: ${{ inputs.ai_unis || vars.AI_UNIS || 'UdK' }}
        run: |
          python -m crawler build --ai --ai-unis "$AI_UNIS" --ai-wait 0
          bash scripts/commit-data.sh "AI batch submitted $(date -u +%F)"

      - name: Build site data (collect AI results, up to 2 h)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_UNIS: ${{ inputs.ai_unis || vars.AI_UNIS || 'UdK' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python -m crawler build
          else python -m crawler build --ai --ai-unis "$AI_UNIS" --ai-wait 120; fi

      - name: Commit data
        id: commit
        if: always()
        run: bash scripts/commit-data.sh "Update course data $(date -u +%F)"

      - name: Upload site
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
